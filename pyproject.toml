[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokerpot"
version = "0.1.0"
description = "A CLI ledger for poker-night money between friends"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Benyamin" }]
keywords = ["poker", "cli", "ledger", "settlement", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pokerpot = "pokerpot.cli:app"

[project.urls]
Homepage = "https://github.com/benyamin-git/poker.cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pokerpot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pokerpot/cli.py" = ["B008"]  # typer.Option/Argument are the documented Typer style
